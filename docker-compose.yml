# FreeBlink + one HTTPS front end, chosen with COMPOSE_PROFILES in .env:
#   tunnel  - Cloudflare Tunnel (recommended): set TUNNEL_TOKEN, no open ports needed
#   caddy   - Caddy with Let's Encrypt: set DOMAIN, open ports 80/443
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      BLINK_DATA_DIR: /data
    volumes:
      - freeblink-data:/data
    # Not published: only the front end can reach it.

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  caddy:
    profiles: [caddy]
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  freeblink-data:
  caddy-data:
  caddy-config:
